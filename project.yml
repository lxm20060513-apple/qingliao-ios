name: 轻聊
options:
  bundleIdPrefix: com.qingliao
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Qingliao:
    type: application
    platform: iOS
    sources:
      - qingliao
    info:
      path: qingliao/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        CFBundleShortVersionString: "2.0.114"
        CFBundleVersion: "114"
        NSLocationWhenInUseUsageDescription: 用于获取当前定位显示天气信息
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: com.qingliao.relay
            CFBundleURLSchemes:
              - qingliao
        NSMicrophoneUsageDescription: 按住说话语音输入需要麦克风权限
        NSSpeechRecognitionUsageDescription: 语音输入需要将语音转换为文字
        NSFaceIDUsageDescription: 使用 Face ID 解锁密码管理与快捷登录
        NSCameraUsageDescription: 拍照输入需要相机权限
        # v2.0.114：后台刷新（方案2推送）——系统定期唤醒检查 AI 回复完成 → 本地通知
        UIBackgroundModes:
          - fetch
        # v2.0.114：Live Activity（AI 回复过程上岛）
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2
        INFOPLIST_KEY_CFBundleDisplayName: 轻聊
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.114"
        CURRENT_PROJECT_VERSION: "114"
        ENABLE_PREVIEWS: YES

  # v2.0.114：Widget Extension（桌面小组件 + Live Activity 回复岛）
  QingliaoWidget:
    type: app-extension
    platform: iOS
    sources:
      - qingliaoWidget
      - path: qingliao/Core/QingliaoActivityAttributes.swift   # 与 App 共享的 ActivityAttributes
    info:
      path: qingliaoWidget/Info.plist
      properties:
        CFBundleDisplayName: 轻聊小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2.widget
        MARKETING_VERSION: "2.0.114"
        CURRENT_PROJECT_VERSION: "114"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Qingliao
        embed: true
