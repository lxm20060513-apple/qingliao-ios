name: Build iOS 2.0 IPA (native SwiftUI, unsigned for SideStore)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v2*'

permissions:
  contents: write

jobs:
  build-ipa:
    # v2.0.53：改回 macos-latest（Xcode 26，xcodegen 生成格式兼容）。
    # 之前 0 steps 失败其实是 private 仓库额度耗尽，不是 runner 故障；
    # macos-14 是 Xcode 15.4 读不了 xcodegen 2.45 生成的项目（Unable to read project）
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild -project 轻聊.xcodeproj \
            -scheme Qingliao \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA (Payload zip, for SideStore)
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/Qingliao.app build/ipa/Payload/
          # v2.0.114：Widget Extension——单独构建后手动嵌入 PlugIns
          # （无签名 archive 的 scheme 不会自动构建/嵌入 extension target）
          xcodebuild -project 轻聊.xcodeproj -target QingliaoWidget -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > /tmp/widget_build.log 2>&1 || echo "WIDGET_BUILD_EXIT=$?"
          echo "=== widget build log tail ==="
          tail -25 /tmp/widget_build.log
          APPEX=$(find build/DD -name "*.appex" | head -1)
          if [ -n "$APPEX" ]; then
            mkdir -p build/ipa/Payload/Qingliao.app/PlugIns
            cp -R "$APPEX" build/ipa/Payload/Qingliao.app/PlugIns/
            echo "Widget embedded: $APPEX"
          else
            echo "WIDGET_BUILD_FAILED_OR_NOT_FOUND"
          fi
          cd build/ipa && zip -qry ../qingliao-2.0-unsigned.ipa Payload/
          ls -la ../qingliao-2.0-unsigned.ipa

      - name: Verify IPA
        run: |
          file build/qingliao-2.0-unsigned.ipa
          unzip -l build/qingliao-2.0-unsigned.ipa | head -8

      - name: Upload IPA to GitHub Release (Hermes 下载后转存 NAS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create qingliao-ipa-2 build/qingliao-2.0-unsigned.ipa \
            --repo ${{ github.repository }} \
            --title "轻聊 2.0 IPA (native, unsigned)" \
            --notes "原生 SwiftUI · iOS 27 液态玻璃 · SideStore 导入安装" \
            || gh release upload qingliao-ipa-2 build/qingliao-2.0-unsigned.ipa \
               --repo ${{ github.repository }} --clobber
          echo "RELEASE_UPLOADED"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-2.0-unsigned-ipa
          path: build/qingliao-2.0-unsigned.ipa
          if-no-files-found: error
